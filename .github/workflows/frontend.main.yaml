name: deploy_frontend
on:
  push:
    branches: [ main ]
    paths:
    - 'frontend/**'
    - '.github/workflows/frontend.main.yaml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Upload to blob storage
      uses: azure/CLI@v2
      with:
        inlineScript: |
          az storage blob upload-batch --account-name azureresumemmm --auth-mode login -d '$web' -s frontend/ --overwrite
    - name: Purge CDN endpoint
      uses: azure/CLI@v2
      with:
        inlineScript: |
          az cdn endpoint purge --content-paths "/*" --profile-name "marmimucloud" --name "marmimucloud" --resource-group "rg-azure-resume-mmm"
    - name: logout
      run: az logout
      if: always()